{% if include.publi.institutions %}<div class="hpc-inst-badges"><span class="hpc-inst-label">Collab with</span>{% for key in include.publi.institutions %}{% assign inst = site.data.institutions[key] %}{% if inst %}{% if inst.url %}<a href="{{ inst.url }}" class="hpc-inst-link" target="_blank" rel="noopener" aria-label="{{ inst.name }}"><img src="{{ '/images/instpic/' | append: inst.logo | relative_url }}" class="hpc-inst-badge" loading="lazy" decoding="async" alt="{{ inst.name }}" title="{{ inst.name }}" /></a>{% else %}<img src="{{ '/images/instpic/' | append: inst.logo | relative_url }}" class="hpc-inst-badge" loading="lazy" decoding="async" alt="{{ inst.name }}" title="{{ inst.name }}" />{% endif %}{% endif %}{% endfor %}</div>{% endif %}
